[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zchat-control-server"
version = "0.1.0"
description = "A local-first ZEAZDEV control plane with a Camfrog provider integration"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.116,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "sqlalchemy>=2.0.52,<2.1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "httpx2>=2,<3",
    "pytest>=8,<10",
]
lint = ["ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
camfrog_control_server = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
