name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -r zchat-client/requirements.txt
      - run: python -m pip_audit -r requirements-dev.txt
      - run: python -m py_compile camfrog_auto.py camfrog_gui.py camfrog_status_gui.py camfrog_private_chat_gui.py camfrog_music_gui.py camfrog_presence.py status_changer_gui.py room_control_gui.py im_autoreply_gui.py status_random_gui.py status_marquee_gui.py chat_im_private_gui.py camfrog_tray.py clipboard_support.py room_control_entry.py chat_im_private_entry.py status_random_entry.py status_marquee_entry.py status_changer_entry.py im_autoreply_entry.py music_dj_entry.py web_status_entry.py tools/web_status.py line/*.py
      - run: python camfrog_auto.py check --config config.example.json
      - run: python camfrog_auto.py --lang th check --config config.example.json
      - run: xvfb-run -a pytest -q tests
      - run: PYTHONPATH=zchat-client/src:control-server/src xvfb-run -a pytest -q zchat-client/tests
  control-server:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: control-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,lint]'
      - run: python -m pip install 'pip-audit>=2.7,<3'
      - run: python -m pip_audit --local --skip-editable
      - run: ruff format --check src tests ../zchat-client/src ../zchat-client/tests
      - run: ruff check src tests ../zchat-client/src ../zchat-client/tests
      - run: pytest -q
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/postgres
  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Audit Windows build dependencies
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pip-audit>=2.7,<3'
          python -m pip_audit -r line/requirements-build.txt
          python -m pip_audit -r zchat-client/requirements-build.txt
      - run: .\full-build.bat
        shell: cmd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: camfrog-apps-windows
          path: |
            dist/
            camfrog-features-windows.zip
            line/dist/line-status-changer.exe
          if-no-files-found: error
