name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: pip install pytest
      - run: python -m py_compile camfrog_auto.py camfrog_gui.py
      - run: python camfrog_auto.py check --config config.json
      - run: python camfrog_auto.py --lang th check --config config.json
      - run: xvfb-run -a pytest -q
  build-windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: .\build.bat
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: camfrog-auto-windows
          path: dist/
          if-no-files-found: error
